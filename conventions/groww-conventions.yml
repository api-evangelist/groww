generated: '2026-07-19'
method: searched
source: https://groww.in/trade-api/docs/curl
description: >-
  Cross-cutting request/response conventions for the Groww Trading API: auth
  style, idempotency, versioning, the response envelope, rate-limit signaling
  and segments. Captured from the cURL reference documentation.
base_url: https://api.groww.in
api_style: REST over HTTPS, JSON request/response

authentication:
  scheme: Bearer access token
  header: 'Authorization: Bearer {ACCESS_TOKEN}'
  token_lifetime: Daily access token expires at 06:00 AM IST.
  flows:
    - API key + secret (approval) — checksum SHA256(secret + timestamp)
    - TOTP — time-based one-time password (no daily approval)
    - OAuth2 authorization_code (RFC 8414 metadata at /.well-known/oauth-authorization-server)
  detail: authentication/groww-authentication.yml

required_headers:
  Authorization: 'Bearer {ACCESS_TOKEN}'
  Accept: application/json
  X-API-VERSION: '1.0'

idempotency:
  supported: true
  mechanism: order_reference_id request field on order creation
  applies_to: Order placement (POST /v1/order/create).
  key_format: Client-supplied unique reference id.
  conflict_behavior: >-
    Reusing an order_reference_id returns error GA007 "Duplicate order reference
    id", preventing duplicate order submission.
  docs: https://groww.in/trade-api/docs/curl

versioning:
  scheme: header
  header: X-API-VERSION
  current: '1.0'

pagination:
  style: page-based
  request_params:
    page: Page index (order list).
    page_size: Items per page.
  note: Order list supports page/page_size parameters; most read endpoints return full sets.

error_envelope:
  shape: '{ status: SUCCESS|FAILURE, payload: {...}, error: { code, message, metadata } }'
  error_code_prefix: GA
  detail: errors/groww-problem-types.yml

rate_limit_signaling:
  documented: true
  detail: rate-limits/groww-rate-limits.yml
  categories:
    - Orders (create/modify/cancel)
    - Live Data (quote/ltp/ohlc)
    - Non Trading (status/list/positions/holdings/margin)

segments:
  supported: [CASH, FNO]
  not_supported: [MCX]

lifecycle: lifecycle/groww-lifecycle.yml
