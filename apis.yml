aid: groww
name: Groww
description: >-
  Groww is an Indian fintech company offering investing and trading in stocks,
  futures & options, mutual funds, ETFs, IPOs and more through its consumer app
  and web platform. Backed by Iconiq Capital, Ribbit Capital and Y Combinator,
  Groww also operates the Groww Trading API — an official programmatic interface
  for algorithmic trading that covers order management (place/modify/cancel),
  portfolio holdings and positions, margin calculation, live market data (LTP,
  full quote, OHLC, option chain and greeks) and historical candle data across
  the CASH (equity) and FNO (derivatives) segments on Indian exchanges. Requests
  hit https://api.groww.in, are versioned with the X-API-VERSION header, and are
  authenticated with a daily Bearer access token generated via an API key +
  secret checksum, a TOTP flow, or an OAuth2 authorization-code flow.
